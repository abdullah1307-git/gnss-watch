[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnss-watch"
version = "0.1.0"
description = "Detect GNSS (GPS) jamming and spoofing affecting aircraft from open ADS-B data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Abdullah Rashid" }]
keywords = ["aviation", "ads-b", "gnss", "gps", "jamming", "spoofing", "geospatial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "requests>=2.31",
    "h3>=4.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "ruff>=0.6", "pyarrow>=14"]

[project.scripts]
gnsswatch = "gnsswatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnsswatch = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
