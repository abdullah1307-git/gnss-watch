<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #161d24; --line: #26313b; --text: #e6edf3; --muted: #8b98a5;
    --low: #2e9e6a; --medium: #e0a526; --high: #e5484d; --spoof: #a855f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto;
    padding: 18px 18px 28px; }
  h1 { font-size: 18px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .card { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .card .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
  .card.high .v { color: var(--high); } .card.spoof .v { color: var(--spoof); }
  label.field { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .4px; margin: 14px 0 6px; }
  select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 8px; font: inherit; }
  .toggles label { display: flex; gap: 8px; align-items: center; margin: 6px 0; cursor: pointer; }
  .legend { display: grid; gap: 6px; margin-top: 4px; }
  .legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .sw { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
  h2 { font-size: 13px; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .5px;
    color: var(--muted); }
  .spot { border: 1px solid var(--line); border-left: 3px solid var(--spoof); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .spot:hover { border-color: var(--spoof); }
  .spot b { font-variant-numeric: tabular-nums; }
  .spot small { color: var(--muted); display: block; }
  .empty { color: var(--muted); font-size: 13px; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 22px; border-top: 1px solid var(--line);
    padding-top: 12px; }
  #map { height: 100vh; background: #0b0f13; }
  .leaflet-popup-content { font: 13px/1.4 system-ui, sans-serif; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    #map { height: 60vh; } aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1 id="title"></h1>
    <div class="sub" id="period"></div>
    <div class="cards" id="cards"></div>

    <label class="field" for="window">Time window</label>
    <select id="window"></select>

    <label class="field">Layers</label>
    <div class="toggles">
      <label><input type="checkbox" id="t-cells" checked> Jamming indicator (cells)</label>
      <label><input type="checkbox" id="t-low"> Show healthy (low) cells</label>
      <label><input type="checkbox" id="t-jumps" checked> Impossible position jumps</label>
      <label><input type="checkbox" id="t-spots" checked> Spoofing hotspots</label>
    </div>

    <label class="field">Legend</label>
    <div class="legend">
      <div><span class="sw" style="background:var(--high)"></span> High: 10% or more of aircraft degraded</div>
      <div><span class="sw" style="background:var(--medium)"></span> Medium: 2 to 10% degraded</div>
      <div><span class="sw" style="background:var(--low)"></span> Low: under 2% degraded</div>
      <div><span class="sw" style="background:var(--spoof)"></span> Spoofing: jumps and hotspots</div>
    </div>

    <h2>Spoofing hotspots</h2>
    <div id="spots"></div>

    <div class="foot">
      <div id="generated"></div>
      <div id="attribution"></div>
      <div style="margin-top:6px">Indicators from public ADS-B data. For situational awareness and
        research only, not an operational or certified safety tool.</div>
    </div>
  </aside>
  <div id="map"></div>
</div>

<script>
const D = __DATA__;
const COLORS = { low: "#2e9e6a", medium: "#e0a526", high: "#e5484d" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n).toLocaleString("en-US");
const pct = (a, b) => b ? (100 * a / b).toFixed(1) + "%" : "n/a";
const S = D.summary;

document.getElementById("title").textContent = D.title;
document.getElementById("period").textContent =
  (S.period_start || "?") + "  to  " + (S.period_end || "?") + "  |  grid " + S.grid;
document.getElementById("generated").textContent = "Generated " + D.generated_utc;
document.getElementById("attribution").textContent = D.attribution;

const levels = S.cells_by_level || {};
document.getElementById("cards").innerHTML = [
  ["Aircraft", fmt(S.aircraft), ""],
  ["Position reports", fmt(S.position_reports), ""],
  ["High cells", fmt(levels.high || 0), "high"],
  ["Medium cells", fmt(levels.medium || 0), ""],
  ["Spoofing hotspots", fmt(S.spoofing_hotspots), "spoof"],
  ["Aircraft with jumps", fmt(S.aircraft_with_jumps), "spoof"],
].map(([k, v, c]) => `<div class="card ${c}"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");

const map = L.map("map", { preferCanvas: true, worldCopyJump: true });
map.fitBounds(D.bounds);
// Base map: Natural Earth country shapes (public domain) drawn as vectors in a pane below
// the data. No tile server, so no API key and no tile usage policy to break.
map.createPane("base").style.zIndex = 250;
map.attributionControl.addAttribution("Natural Earth | flight data &copy; adsb.lol (ODbL)");
fetch("https://unpkg.com/world-atlas@2/countries-50m.json")
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(topo => {
    L.geoJSON(topojson.feature(topo, topo.objects.countries), {
      pane: "base", interactive: false,
      style: { color: "#3a4a58", weight: 0.8, fillColor: "#1c2630", fillOpacity: 1 },
    }).addTo(map);
  })
  .catch(err => console.warn("Base map unavailable, showing data only:", err));

const cellLayer = L.layerGroup().addTo(map);
const jumpLayer = L.layerGroup().addTo(map);
const spotLayer = L.layerGroup().addTo(map);

function ring(cell) { return (D.geometry[cell] || []).map(([lon, lat]) => [lat, lon]); }

function drawCells() {
  cellLayer.clearLayers();
  if (!document.getElementById("t-cells").checked) return;
  const showLow = document.getElementById("t-low").checked;
  const key = document.getElementById("window").value;
  const rows = key === "all" ? D.overall : (D.windows[key] || []);
  for (const r of rows) {
    const [cell, n, bad, level] = r;
    if (level === "low" && !showLow) continue;
    const color = COLORS[level];
    if (!color) continue;
    const poly = L.polygon(ring(cell), {
      color, weight: 0.6, fillColor: color, fillOpacity: level === "low" ? 0.18 : 0.5,
    });
    let html = `<b>Jamming indicator: ${esc(level)}</b><br>${fmt(bad)} of ${fmt(n)} aircraft degraded (${pct(bad, n)})`;
    if (key === "all") html += `<br>Peak window ratio: ${(100 * r[4]).toFixed(0)}%<br>Windows at high: ${r[5]}`;
    html += `<br><small>${esc(cell)}</small>`;
    poly.bindPopup(html);
    cellLayer.addLayer(poly);
  }
}

function drawJumps() {
  jumpLayer.clearLayers();
  if (!document.getElementById("t-jumps").checked) return;
  for (const [la1, lo1, la2, lo2, icao, t, nm] of D.jumps) {
    L.polyline([[la1, lo1], [la2, lo2]], { color: "#a855f7", weight: 1.4, opacity: 0.75, dashArray: "4 4" })
      .bindPopup(`<b>Impossible jump</b><br>Aircraft ${esc(icao)}<br>${esc(t)}<br>${nm} NM`)
      .addTo(jumpLayer);
    L.circleMarker([la2, lo2], { radius: 2.5, color: "#a855f7", weight: 1, fillOpacity: 0.9 }).addTo(jumpLayer);
  }
}

function drawSpots() {
  spotLayer.clearLayers();
  const list = document.getElementById("spots");
  if (!D.hotspots.length) { list.innerHTML = '<div class="empty">None detected in this period.</div>'; }
  else {
    list.innerHTML = D.hotspots.map((h, i) =>
      `<div class="spot" data-i="${i}"><b>${h[2]} aircraft</b>, ${h[3]} jumps
       <small>${esc(h[4])} to ${esc(h[5])}</small>
       <small>${h[0].toFixed(3)}, ${h[1].toFixed(3)}</small></div>`).join("");
    list.querySelectorAll(".spot").forEach(el => el.addEventListener("click", () => {
      const h = D.hotspots[+el.dataset.i]; map.setView([h[0], h[1]], 8);
    }));
  }
  if (!document.getElementById("t-spots").checked) return;
  for (const [lat, lon, n, ev, t0, t1, ac] of D.hotspots) {
    L.circleMarker([lat, lon], { radius: 9 + 2 * Math.min(n, 10), color: "#a855f7", weight: 2, fillOpacity: 0.25 })
      .bindPopup(`<b>Spoofing hotspot</b><br>${n} aircraft, ${ev} jumps<br>${esc(t0)} to ${esc(t1)}<br><small>${esc(ac)}</small>`)
      .addTo(spotLayer);
  }
}

const sel = document.getElementById("window");
sel.innerHTML = `<option value="all">Whole period</option>` + Object.keys(D.windows).map(k => {
  const rows = D.windows[k];
  const hi = rows.filter(r => r[3] === "high").length;
  return `<option value="${esc(k)}">${esc(k)}${hi ? "  (" + hi + " high)" : ""}</option>`;
}).join("");

sel.addEventListener("change", drawCells);
["t-cells", "t-low"].forEach(id => document.getElementById(id).addEventListener("change", drawCells));
document.getElementById("t-jumps").addEventListener("change", drawJumps);
document.getElementById("t-spots").addEventListener("change", drawSpots);
drawCells(); drawJumps(); drawSpots();
</script>
</body>
</html>
